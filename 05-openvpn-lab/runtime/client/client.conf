client
dev tun
proto udp
remote openvpn-server 1194
resolv-retry infinite
nobind
persist-key
persist-tun

remote-cert-tls server
tls-version-min 1.3
tls-ciphersuites TLS_AES_256_GCM_SHA384
data-ciphers AES-256-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-256-GCM
auth SHA256

ca /shared/pki/ca.crt
cert /shared/pki/client.crt
key /shared/pki/client.key
tls-crypt /shared/pki/ta.key
verb 4
